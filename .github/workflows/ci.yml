name: GymStats CI

on:
  push:
    branches: ["master", "feature/**"]
  pull_request:
    branches: ["master"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore tests
        run: dotnet restore GymStats.Tests/GymStats.Tests.csproj
      - name: Run unit tests
        run: dotnet test GymStats.Tests/GymStats.Tests.csproj --configuration Release --no-restore

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore Android
        run: dotnet restore GymStats/GymStats.csproj -p:TargetFramework=net10.0-android
      - name: Build Android
        run: dotnet build GymStats/GymStats.csproj -f net10.0-android -c Release --no-restore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Restore Windows
        run: dotnet restore GymStats/GymStats.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -r win-x64
      - name: Build Windows
        run: dotnet build GymStats/GymStats.csproj -f net10.0-windows10.0.19041.0 -c Release --no-restore -r win-x64

  build-ios:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Restore
        run: dotnet restore GymStats/GymStats.csproj -p:TargetFramework=net10.0-ios
      - name: Build iOS
        run: dotnet build GymStats/GymStats.csproj -f net10.0-ios -c Release --no-restore -p:EnableCodeSigning=false
      - name: Build Mac Catalyst
        run: dotnet build GymStats/GymStats.csproj -f net10.0-maccatalyst -c Release --no-restore -p:EnableCodeSigning=false